<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('박스스코어')}"></head>
<body>
<header th:replace="~{fragments :: nav(${h})}"></header>
<main class="page">
    <h1 th:text="${b.away()} + ' ' + ${b.awayRuns()} + ' : ' + ${b.homeRuns()} + ' ' + ${b.home()}"></h1>
    <p class="muted" th:text="${b.season()} + ' 시즌 · 경기 ' + ${b.gameNo()}"></p>

    <table class="compact line">
        <tr><th></th><th th:each="v, st : ${b.awayLine()}" th:text="${st.count}"></th><th>R</th></tr>
        <tr><td th:text="${b.away()}"></td><td class="num" th:each="v : ${b.awayLine()}" th:text="${v}"></td>
            <td class="num strong" th:text="${b.awayRuns()}"></td></tr>
        <tr><td th:text="${b.home()}"></td>
            <td class="num" th:each="v : ${b.homeLine()}" th:text="${v < 0} ? 'X' : ${v}"></td>
            <td class="num strong" th:text="${b.homeRuns()}"></td></tr>
    </table>

    <div class="grid">
        <section class="card" th:each="side : ${ {0, 1} }">
            <h2 th:text="${side == 0} ? ${b.away()} : ${b.home()}"></h2>
            <table class="data">
                <tr><th>타자</th><th>타수</th><th>득점</th><th>안타</th><th>타점</th><th>볼넷</th><th>삼진</th><th>홈런</th></tr>
                <tr th:each="x : ${side == 0 ? b.awayBatting() : b.homeBatting()}">
                    <td th:text="${x.name()}"></td>
                    <td class="num" th:text="${x.ab()}"></td>
                    <td class="num" th:text="${x.r()}"></td>
                    <td class="num" th:text="${x.h()}"></td>
                    <td class="num" th:text="${x.rbi()}"></td>
                    <td class="num" th:text="${x.bb()}"></td>
                    <td class="num" th:text="${x.so()}"></td>
                    <td class="num" th:text="${x.hr()}"></td>
                </tr>
            </table>
            <table class="data">
                <tr><th>투수</th><th>이닝</th><th>피안타</th><th>실점</th><th>자책</th><th>볼넷</th><th>삼진</th><th>피홈런</th><th>투구</th><th></th></tr>
                <tr th:each="x : ${side == 0 ? b.awayPitching() : b.homePitching()}">
                    <td th:text="${x.name()}"></td>
                    <td class="num" th:text="${x.ip()}"></td>
                    <td class="num" th:text="${x.h()}"></td>
                    <td class="num" th:text="${x.r()}"></td>
                    <td class="num" th:text="${x.er()}"></td>
                    <td class="num" th:text="${x.bb()}"></td>
                    <td class="num" th:text="${x.so()}"></td>
                    <td class="num" th:text="${x.hr()}"></td>
                    <td class="num" th:text="${x.pitches()}"></td>
                    <td class="strong" th:text="${x.decision()}"></td>
                </tr>
            </table>
        </section>
    </div>
</main>
</body>
</html>
