<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments :: head('로그인')}"></head>
<body class="center">
<main class="card narrow">
    <h1>MLB 매니저</h1>
    <p class="ok" th:if="${param.signed}">가입했습니다. 로그인하세요.</p>
    <p class="ok" th:if="${param.logout}">로그아웃했습니다.</p>
    <p class="err" th:if="${param.error}">아이디 또는 비밀번호가 맞지 않습니다.</p>
    <form th:action="@{/login}" method="post" class="stack">
        <label>아이디 <input name="username" autocomplete="username" required autofocus></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
    </form>
    <p class="muted">계정이 없으면 <a th:href="@{/signup}">가입</a></p>
</main>
</body>
</html>
