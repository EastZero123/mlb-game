# mlb-162.com: / → 이 서비스 (8090), /game → 기존 서비스 (8080, 자체 context path /game)
# 적용: sudo cp 후 sudo nginx -t && sudo systemctl reload nginx
# 관리 포트(8091, actuator)는 넣지 않는다 (서버 내부 전용)

server {
    server_name mlb-162.com www.mlb-162.com;

    # 기존 서비스: 경로를 그대로 넘긴다 (/game/... → 8080 의 /game/...)
    location /game {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 기존 서비스가 WebSocket 을 쓰는 경우 (원래 설정 유지)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 이 서비스의 정적 파일 (htmx 라이브러리·CSS): 브라우저 캐시로 서버 요청을 줄인다
    location ^~ /webjars/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }
    location ^~ /css/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 1d;
    }

    # 이 서비스 (MLB 매니저)
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 오프시즌 단계·FA 라운드 처리가 저사양 서버에서 수 초 걸릴 수 있어 넉넉하게
        proxy_read_timeout 90s;
        client_max_body_size 1m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mlb-162.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mlb-162.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.mlb-162.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = mlb-162.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mlb-162.com www.mlb-162.com;
    return 404; # managed by Certbot
}
